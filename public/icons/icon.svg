<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e33" />
      <stop offset="100%" stop-color="#191c1f" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97746" />
      <stop offset="100%" stop-color="#b85d38" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background base rounded container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle border ring -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#f5efe6" stroke-opacity="0.12" stroke-width="6" />

  <!-- Center brand badge -->
  <g filter="url(#shadow)">
    <!-- Rust accent background disk -->
    <circle cx="256" cy="256" r="144" fill="url(#accent)" />
    
    <!-- Stylized Modern Geometric M / Tools mark -->
    <path d="M192 328 V200 L256 264 L320 200 V328" 
          fill="none" 
          stroke="#f5efe6" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Subtle top spark accent -->
    <circle cx="256" cy="154" r="14" fill="#f5efe6" />
  </g>
</svg>
