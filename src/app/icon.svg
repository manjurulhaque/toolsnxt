<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2f35" />
      <stop offset="100%" stop-color="#181b1e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97746" />
      <stop offset="100%" stop-color="#b85d38" />
    </linearGradient>
  </defs>

  <!-- Base background container -->
  <rect width="32" height="32" rx="7.5" fill="url(#brandGrad)" />
  
  <!-- Subtle border for dark mode tab contrast -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="#f5efe6" stroke-opacity="0.15" stroke-width="1" />

  <!-- Rust accent disk -->
  <circle cx="16" cy="16" r="9" fill="url(#accentGrad)" />

  <!-- High-contrast bold mark visible at 16px/32px -->
  <path d="M12 20.5 V12.5 L16 16.5 L20 12.5 V20.5" 
        fill="none" 
        stroke="#f5efe6" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
